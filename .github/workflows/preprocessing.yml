name: Automated Preprocessing Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  preprocessing:
    runs-on: ubuntu-latest
    name: Run Preprocessing Pipeline

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn

      - name: Run Preprocessing Script
        run: |
          python preprocessing/automate_Dea-Zasqia-Pasaribu-Malau.py \
            --input heart_disease_raw.csv \
            --output preprocessing/heart_disease_preprocessing

      - name: Verify Output
        run: |
          ls -lh preprocessing/heart_disease_preprocessing/
          python -c "
          import pandas as pd
          X = pd.read_csv('preprocessing/heart_disease_preprocessing/X_train.csv')
          assert X.isnull().sum().sum() == 0
          print('X_train shape:', X.shape)
          print('Preprocessing berhasil!')
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heart_disease_preprocessed
          path: preprocessing/heart_disease_preprocessing/
          retention-days: 30

      - name: Commit Preprocessed Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/heart_disease_preprocessing/
          git diff --staged --quiet || git commit -m "chore: update preprocessed dataset [skip ci]"
          git push origin main || echo "Nothing to push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
